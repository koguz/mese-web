<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meşe 3D App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
        }

        .logo {
            width: auto;
            min-width: 180px;
            height: 120px;
            padding: 0 30px;
            background: linear-gradient(135deg, #58a6ff 0%, #1f6feb 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(88, 166, 255, 0.2);
        }

        .loading-text {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(88, 166, 255, 0.1);
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .logo {
                min-width: 140px;
                height: 100px;
                padding: 0 20px;
                font-size: 24px;
            }

            .loading-text {
                font-size: 1.5rem;
            }

            .spinner {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container" role="main" aria-live="polite" aria-label="Loading application">
        <div class="logo" aria-hidden="true">MEŞE 3D</div>
        <div class="loading-text">Coming soon!</div>
    </div>
</body>
</html>
